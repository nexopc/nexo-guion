<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8">
  <!-- maximum-scale=1 evita que el iPhone haga zoom al tocar un campo de texto -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>NEXO Guion</title>
  <meta name="description" content="Ideas y guiones de video de NEXO PC. Funciona sin internet.">
  <meta name="theme-color" content="#03BDDE">
  <!-- Para que en el iPhone se abra como app (sin barra de Safari) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NEXO Guion">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app" class="app">
    <header class="top" id="top"></header>
    <div id="pre"></div>
    <main class="scroll" id="screen"></main>
    <div class="footbar" id="foot" hidden></div>
    <nav class="tabs" id="tabs">
      <button data-tab="home"><span class="ti">🎬</span>Proyectos</button>
      <button data-tab="clientes"><span class="ti">👥</span>Clientes</button>
      <button data-tab="ganchos"><span class="ti">🪝</span>Ganchos</button>
      <button data-tab="aprender"><span class="ti">🎓</span>Aprender</button>
    </nav>
    <button class="fab" id="fab" aria-label="Nueva idea"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg></button>
    <div id="modal"></div>
    <div id="wiz"></div>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <!-- Zona oculta donde se arma el PDF antes de convertirlo -->
  <div id="pdfStage" aria-hidden="true"></div>

  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/html2canvas.min.js"></script>
  <script src="ganchos.js"></script>
  <script src="aprender.js"></script>
  <script src="app.js"></script>
</body>
</html>
